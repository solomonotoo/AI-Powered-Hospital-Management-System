# ═══════════════════════════════════════════════════════════════════════════
# HMS — Base Infrastructure
# Shared by both development and production
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_hms_db
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # optional init scripts
      - ./init-db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d ai_hms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

