version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
# HMS — Production Overrides
# ═══════════════════════════════════════════════════════════════════════════

services:

  hms-app:
    image: hms-app:latest
    container_name: hms-app

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hms
      DB_USERNAME: hms_user
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      SMTP_HOST: mailhog
      SMTP_PORT: 1025

      # AI_SERVICE_BASE_URL: http://ai-sidecar:8000

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    ports:
      - "9001:9001"

  grafana:
    ports:
      - "3000:3000"