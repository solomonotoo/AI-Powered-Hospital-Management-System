# ═══════════════════════════════════════════════════════════════════════════
# application-dev.yml — Development overrides
# ═══════════════════════════════════════════════════════════════════════════
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_hms_db}
    username: ${DB_USERNAME:hms_user}
    password: ${DB_PASSWORD:shopme123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:hms_redis_dev}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#  mail:
#    host: ${SMTP_HOST:localhost}
#    port: ${SMTP_PORT:1025}
#    properties:
#      mail.smtp.auth: false

management:
  tracing:
    sampling:
      probability: 1.0   # 100% tracing in dev

logging:
  level:
    org.springfrawork.security: DEBUG
    com.ai_powered_hms_backend: DEBUG
    org.springframework.modulith: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

