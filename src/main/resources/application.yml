spring:
  application:
    name: hms-application

  aop:
    proxy-target-class: true

  profiles:
    active: dev

  # ============================================================
  # DATASOURCE - PostgreSQL
  # ============================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_hms_db
    username: hms_user
    password: shopme123
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

        jdbc:
          batch_size: 25

        order_inserts: true
        order_updates: true

  # ============================================================
  # FLYWAY
  # ============================================================
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  # ============================================================
  # JACKSON
  # ============================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false

    deserialization:
      fail-on-unknown-properties: false

    default-property-inclusion: NON_NULL

  # ============================================================
  # SPRING MODULITH
  # ============================================================
  modulith:
    events:
      republish-outstanding-events-on-restart: true


# ==============================================================
# SERVER
# ==============================================================
server:
  port: 8080

  compression:
    enabled: true
    mime-types: application/json,text/html

  error:
    include-message: always
    include-binding-errors: always


# ==============================================================
# ACTUATOR
# ==============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith,mappings

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 0.1


# ==============================================================
# SPRINGDOC / SWAGGER
# ==============================================================
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  default-produces-media-type: application/json


# ==============================================================
# HMS APPLICATION
# ==============================================================
app:
  security:
    jwt:
      secret: 8a9f2c1d7e4b6f9083c5a1d2e7f9b4c6a8d1e3f5b7c9d2a4e6f8b1c3d5e7f9a2

      access-token:
        expiration-minutes: 15

      refresh-token:
        expiration-days: 30

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173