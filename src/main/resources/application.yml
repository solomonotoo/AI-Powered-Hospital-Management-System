# ═══════════════════════════════════════════════════════════════════════════
# application.yml — Base configuration (all profiles)
# ═══════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: hms-application

#========================================
#Spring AOP proxying issue
#=================================
  aop:
    proxy-target-class: true

  # ── Profiles ──────────────────────────────────────────────────────────
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA / Hibernate ───────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway manages schema; Hibernate only validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway ────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  # ── Jackson ───────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL

  # ── Modulith ──────────────────────────────────────────────────────────
  modulith:
    events:
      republish-outstanding-events-on-restart: true

# ── Server ──────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator ────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith,mappings
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1   # 10% sampling in base; override per profile

# ── OpenAPI / Swagger ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

# ── HMS Application Properties ──────────────────────────────────────────
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token:
        expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
      refresh-token:
        expiration-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}    
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
