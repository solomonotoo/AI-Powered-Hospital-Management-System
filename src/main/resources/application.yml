# ═══════════════════════════════════════════════════════════════════════════
# application-test.yml — Test overrides
# ═══════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: test

  flyway:
    clean-on-validation-error: true

  jpa:
    show-sql: false

hms:
  jwt:
    secret: test-secret-key-for-unit-and-integration-tests-only-256bits
    access-token-expiry-minutes: 60
    refresh-token-expiry-days: 1

logging:
  level:
    com.hms: DEBUG
    org.springframework.modulith: DEBUG